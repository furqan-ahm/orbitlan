name: CI

on:
  push:
    branches: [main, native-cpp-client]
  pull_request:

permissions:
  contents: read

jobs:
  coordinator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/engine/go.mod
          cache-dependency-path: client/engine/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test and build engine
        working-directory: client/engine
        run: |
          go test ./...
          go build -trimpath -o ../ui/payload/orbitlan-engine.exe .
      - name: Build UI
        run: dotnet build client/ui/OrbitLan.csproj -c Release
      - name: Build native client, service, and installer
        run: |
          cmake -S client/native -B build/native -A x64
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native -C Release --output-on-failure
      - name: Stage native preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/native-artifact/driver -Force | Out-Null
          New-Item -ItemType Directory -Path build/native-artifact/assets -Force | Out-Null
          Copy-Item build/native/bin/OrbitLan.exe,build/native/bin/OrbitLanService.exe,build/native/bin/OrbitLanSetup.exe build/native-artifact/
          Copy-Item client/ui/payload/orbitlan-engine.exe build/native-artifact/
          Copy-Item client/ui/payload/driver/* build/native-artifact/driver/
          Copy-Item client/ui/assets/earth-clouds.gif build/native-artifact/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitLan-Native-${{ github.sha }}
          path: build/native-artifact
          if-no-files-found: error
